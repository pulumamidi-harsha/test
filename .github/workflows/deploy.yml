# Adapted from arun-arudra/Arun-Arudra-web (.github/workflows/deploy.yml)
# for Nexora Sites (Next.js).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   CONTENTFUL_NEWS_SPACE_ID, CONTENTFUL_NEWS_DELIVERY_TOKEN
#   CONTENTFUL_NEWS_MANAGEMENT_TOKEN
#   PROD_N8N_WEBHOOK_URL, DEV_N8N_WEBHOOK_URL (optional)
#   NEXT_PUBLIC_GA_MEASUREMENT_ID (optional)
#   RESEND_API_KEY, CONTACT_TO_EMAIL, CONTACT_FROM_EMAIL (optional)
#
# Note: Arun’s app is Vite → dist/ → Bluehost FTP. This app is Next.js and needs
# a Node host for /admin and API routes. The FTP step mirrors Arun’s pipeline;
# uploading .next alone will not run the full app on Bluehost shared hosting.

name: Build and Deploy

on:
  push:
    branches:
      - main
      - feature/nexora-sites
  pull_request:
    branches:
      - main
      - feature/nexora-sites
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  BUILD_COMMAND: "npm run build"
  DEPLOY_SOURCE: "./.next/"

  WEBSITE_URL: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'https://nexorasites.com/' || 'https://nexorasites.com/' }}
  DEPLOY_DESTINATION: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && './' || './dev/' }}
  FTP_SERVER: ${{ secrets.FTP_SERVER }}
  FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  NEXT_PUBLIC_SITE_URL: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'https://nexorasites.com' || 'https://nexorasites.com' }}

  N8N_WEBHOOK_URL: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && secrets.PROD_N8N_WEBHOOK_URL || secrets.DEV_N8N_WEBHOOK_URL }}

  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  CONTENTFUL_NEWS_SPACE_ID: ${{ secrets.CONTENTFUL_NEWS_SPACE_ID }}
  CONTENTFUL_NEWS_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_NEWS_DELIVERY_TOKEN }}
  CONTENTFUL_NEWS_ENVIRONMENT: ${{ vars.CONTENTFUL_NEWS_ENVIRONMENT || 'master' }}
  CONTENTFUL_NEWS_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_NEWS_MANAGEMENT_TOKEN }}

  NEXT_PUBLIC_CMS_ADMIN_BASE: ${{ vars.NEXT_PUBLIC_CMS_ADMIN_BASE || '/admin' }}
  NEXT_PUBLIC_NEWS_PER_PAGE: ${{ vars.NEXT_PUBLIC_NEWS_PER_PAGE || '9' }}
  NEXT_PUBLIC_TESTIMONIALS_VISIBLE_COUNT: ${{ vars.NEXT_PUBLIC_TESTIMONIALS_VISIBLE_COUNT || '8' }}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
  CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show deployment config
        run: |
          echo "Branch      : ${{ github.ref_name }}"
          echo "Website URL : ${{ env.WEBSITE_URL }}"
          echo "Deploy dest : ${{ env.DEPLOY_DESTINATION }}"
          echo "Site URL    : ${{ env.NEXT_PUBLIC_SITE_URL }}"

      - name: Lint
        run: npm run lint

      - name: Build project
        run: ${{ env.BUILD_COMMAND }}

      - name: Verify build artifacts
        run: |
          if [ -d "./.next" ]; then
            echo "✅ Build successful (.next present)"
            ls -la ./.next | head -15
          else
            echo "❌ .next folder not found"
            exit 1
          fi

      # Same FTP action as Arun. Prefer a Node host for production; Bluehost
      # shared cannot run Next.js /admin or API routes from uploaded .next alone.
      - name: Deploy to server
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ${{ env.DEPLOY_SOURCE }}
          server-dir: ${{ env.DEPLOY_DESTINATION }}
          state-name: .ftp-deploy-sync-state-${{ github.ref_name }}.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cache/**
          dry-run: false

      - name: Wait for deploy to propagate
        if: github.event_name != 'pull_request'
        run: sleep 15

      - name: Health check - verify live site responds
        if: github.event_name != 'pull_request'
        run: |
          echo "Checking ${{ env.WEBSITE_URL }} ..."
          RESPONSE=$(curl -s -L --max-time 20 -H "Cache-Control: no-cache" "${{ env.WEBSITE_URL }}?healthcheck=${{ github.sha }}" || true)
          if [ -z "$RESPONSE" ]; then
            echo "Health check WARNING - no response from ${{ env.WEBSITE_URL }}"
            echo "If the site is not on Bluehost/Node yet, this is expected."
            exit 0
          fi
          if echo "$RESPONSE" | grep -qi 'nexora\|__next\|Nexora'; then
            echo "Health check PASSED - site is responding"
          else
            echo "Health check WARNING - unexpected response body"
            echo "--- First 500 chars ---"
            echo "$RESPONSE" | head -c 500
          fi
          echo "Commit: ${{ github.sha }}"
          echo "Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Deployment complete
        if: github.event_name != 'pull_request'
        run: |
          echo "=============================="
          echo "Pipeline finished"
          echo "${{ env.WEBSITE_URL }}"
          echo "=============================="
